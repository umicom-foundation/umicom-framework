<?xml version="1.0" encoding="UTF-8"?>
<!--
  This transparent wordmark is intended for light and neutral surfaces. The
  letters use transparent counters, so the centre of each letter naturally
  shows the surface beneath it instead of drawing a white patch.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1060 256"
     role="img"
     aria-labelledby="umicom-logo-title umicom-logo-description">
  <title id="umicom-logo-title">Umicom</title>
  <desc id="umicom-logo-description">The Umicom code mark and wordmark.</desc>
  <g>
    <path fill="#B4363F" d="M22 57 101 12v37L22 94Z"/>
    <path fill="#315B78" d="m115 12 119 68-30 17-89-51Z"/>
    <path fill="#315B78" d="m22 104 79-45 30 17-79 45 52 30v37l-82-47Z"/>
    <path fill="#315B78" d="m116 58 88 51-56 32-30-17 56-32-58-34Z"/>
    <path fill="#B4363F" d="m148 153 86-49v37l-86 49Z"/>
    <path fill="#315B78" d="m22 149 87 50v36l-87-50Z"/>
  </g>
  <!-- Text is used deliberately so its counters remain transparent. -->
  <text x="282" y="184"
        fill="#203247"
        font-family="Segoe UI Variable Display, Segoe UI, Inter, sans-serif"
        font-size="166"
        font-weight="650"
        letter-spacing="1">umicom</text>
</svg>
