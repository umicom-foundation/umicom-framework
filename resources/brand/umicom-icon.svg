<?xml version="1.0" encoding="UTF-8"?>
<!--
  Umicom Framework owns this transparent vector mark so every application can
  display the same identity at any screen density without copying artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     role="img"
     aria-labelledby="umicom-icon-title umicom-icon-description">
  <title id="umicom-icon-title">Umicom</title>
  <desc id="umicom-icon-description">An interlocking red and blue code mark.</desc>
  <g>
    <!-- The upper red band starts the left-facing half of the mark. -->
    <path fill="#B4363F" d="M22 57 101 12v37L22 94Z"/>
    <!-- The upper blue band balances the mark and forms its open right edge. -->
    <path fill="#315B78" d="m115 12 119 68-30 17-89-51Z"/>
    <!-- This folded blue path forms the left chevron and lower return. -->
    <path fill="#315B78" d="m22 104 79-45 30 17-79 45 52 30v37l-82-47Z"/>
    <!-- The centre chevron keeps the symbol legible at small icon sizes. -->
    <path fill="#315B78" d="m116 58 88 51-56 32-30-17 56-32-58-34Z"/>
    <!-- The lower red band closes the right-facing half of the mark. -->
    <path fill="#B4363F" d="m148 153 86-49v37l-86 49Z"/>
    <!-- The final blue band gives the symbol a stable lower edge. -->
    <path fill="#315B78" d="m22 149 87 50v36l-87-50Z"/>
  </g>
</svg>
