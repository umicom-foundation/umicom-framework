<?xml version="1.0" encoding="UTF-8"?>
<!--
  This transparent wordmark keeps the Umicom name readable on dark surfaces.
  Applications select this variant through the Framework resource catalogue.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1060 256"
     role="img"
     aria-labelledby="umicom-dark-logo-title umicom-dark-logo-description">
  <title id="umicom-dark-logo-title">Umicom</title>
  <desc id="umicom-dark-logo-description">The Umicom code mark and light wordmark.</desc>
  <g>
    <path fill="#D04B55" d="M22 57 101 12v37L22 94Z"/>
    <path fill="#5B91B8" d="m115 12 119 68-30 17-89-51Z"/>
    <path fill="#5B91B8" d="m22 104 79-45 30 17-79 45 52 30v37l-82-47Z"/>
    <path fill="#5B91B8" d="m116 58 88 51-56 32-30-17 56-32-58-34Z"/>
    <path fill="#D04B55" d="m148 153 86-49v37l-86 49Z"/>
    <path fill="#5B91B8" d="m22 149 87 50v36l-87-50Z"/>
  </g>
  <!-- The pale wordmark provides clear contrast without a background tile. -->
  <text x="282" y="184"
        fill="#F4F7FB"
        font-family="Segoe UI Variable Display, Segoe UI, Inter, sans-serif"
        font-size="166"
        font-weight="650"
        letter-spacing="1">umicom</text>
</svg>
